<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Cleaner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="popup-root">
    <header id="popup-header">
      <div id="popup-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="8" fill="var(--accent)"/>
          <path d="M8 6h12a2 2 0 0 1 2 2v14l-6-3-6 3V8a2 2 0 0 1 2-2z"
                fill="none" stroke="white" stroke-width="1.8"
                stroke-linejoin="round"/>
          <line x1="11" y1="11" x2="17" y2="11"
                stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="14" x2="15" y2="14"
                stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="popup-title-wrap">
        <span id="popup-title"></span>
      </div>
    </header>

    <div id="popup-stats">
      <div class="stat-pill" id="stat-bookmarks">
        <span class="stat-num" id="stat-bk-num">—</span>
        <span class="stat-label" id="stat-bk-label"></span>
      </div>
      <div class="stat-pill" id="stat-folders">
        <span class="stat-num" id="stat-fl-num">—</span>
        <span class="stat-label" id="stat-fl-label"></span>
      </div>
    </div>

    <div id="popup-loading" role="status" aria-live="polite"></div>

    <button id="open-manager-btn" type="button"></button>

    <footer id="popup-footer">
      <span id="popup-tagline"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
